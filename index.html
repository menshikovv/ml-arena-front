<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ML-Арена — соревнования, дуэли и подтвержденный ML-паспорт для специалистов по машинному обучению." />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (() => {
        let savedTheme = null;
        try {
          savedTheme = localStorage.getItem("ml-arena-theme");
        } catch {}
        const dark = savedTheme === "dark";
        document.documentElement.classList.toggle("dark", dark);
        document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#050914" : "#ffffff");
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ML-Арена — соревнования по ИИ и машинному обучению" />
    <meta property="og:description" content="Решайте реальные задачи, участвуйте в дуэлях и подтверждайте навыки результатами." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ML-Арена — соревнования по ИИ и машинному обучению" />
    <meta name="twitter:description" content="Решайте реальные задачи, участвуйте в дуэлях и подтверждайте навыки результатами." />
    <title>ML-Арена — соревнования по ИИ и машинному обучению</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
